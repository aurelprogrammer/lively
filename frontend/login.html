
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — LIVELY</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">

<nav class="navbar navbar-dark">
    <div class="container">
        <a class="navbar-brand fw-bold fs-3" href="index.html">LIVELY<span>.</span></a>
        <a href="index.html" class="text-white text-decoration-none">← Back to Home</a>
    </div>
</nav>

<main class="auth-wrapper">
    <div class="auth-card">
        <span class="section-label">WELCOME BACK</span>
        <h1>Login to LIVELY.</h1>
        <p class="auth-subtitle">Masuk dan temukan pengalaman musik favoritmu.</p>

        <form id="loginForm">
            <div class="mb-3">
                <label for="email" class="form-label">Email Address</label>
                <input type="email" class="form-control" id="email"
                    placeholder="nama@email.com" required>
            </div>

            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password"
                    placeholder="Masukkan password" minlength="6" required>
            </div>

            <div class="d-flex justify-content-between mb-4">
                <label class="small">
                    <input type="checkbox" id="showPassword"> Show password
                </label>
                <a href="#" class="auth-link" id="forgotPassword">Forgot password?</a>
            </div>

            <button type="submit" class="btn btn-gold w-100 py-3 rounded-pill">
                Login
            </button>

            <p id="loginMessage" class="mt-3 small text-center" aria-live="polite"></p>
        </form>

        <p class="auth-bottom">
            Don't have an account?
            <a href="register.html">Create Account</a>
        </p>
    </div>
</main>

<script type="module" src="js/script.js"></script>
</body>
</html>
