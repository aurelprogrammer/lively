
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Riwayat Tiket | LIVELY</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f7f7f7;
            font-family: Arial, sans-serif;
        }

        .ticket-card {
            background: white;
            border-radius: 14px;
            padding: 22px;
            margin-bottom: 20px;
            box-shadow: 0 3px 12px rgba(0,0,0,.06);
        }

        .qr-box {
            background: white;
            display: inline-block;
            padding: 12px;
            border: 1px solid #eee;
            border-radius: 10px;
            margin-top: 12px;
        }

        .demo-label {
            color: #a66a00;
            background: #fff2d5;
            padding: 7px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }

        .ticket-item {
            border: 1px dashed #ccc;
            border-radius: 12px;
            padding: 16px;
            margin-top: 14px;
        }
    </style>
</head>

<body>

<div class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="fw-bold">Riwayat Tiket</h2>
            <p class="text-muted mb-0">Semua pesanan LIVELY kamu.</p>
        </div>

        <a href="index.html" class="btn btn-outline-dark">
            Kembali
        </a>
    </div>

    <div class="mb-4">
        <span class="demo-label">SIMULASI PEMBAYARAN</span>
    </div>

    <div id="message" class="text-center py-4">
        Memuat riwayat pembelian...
    </div>

    <div id="ordersContainer"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<script type="module">
    import { supabase } from "./js/supabase.js";

    const message = document.getElementById("message");
    const container = document.getElementById("ordersContainer");

    async function loadOrders() {
        try {
            const { data: userData, error: userError } =
                await supabase.auth.getUser();

            if (userError) throw userError;

            const user = userData.user;

            if (!user) {
                message.textContent =
                    "Silakan login untuk melihat riwayat tiket.";

                return;
            }

            const { data: orders, error } = await supabase
                .from("orders")
                .select(`
                    id,
                    order_code,
                    buyer_name,
                    buyer_email,
                    buyer_phone,
                    artist,
                    ticket_type,
                    quantity,
                    unit_price,
                    total,
                    payment_method,
                    payment_status,
                    created_at
                `)
                .eq("user_id", user.id)
                .order("created_at", { ascending: false });

            if (error) throw error;

            if (!orders || orders.length === 0) {
                message.textContent =
                    "Belum ada riwayat pembelian tiket.";

                return;
            }

            message.textContent = "";

            for (const order of orders) {
                const card = document.createElement("div");
                card.className = "ticket-card";

                const date = new Date(order.created_at)
                    .toLocaleString("id-ID");

                card.innerHTML = `
                    <div class="d-flex justify-content-between flex-wrap gap-2">
                        <div>
                            <h5 class="fw-bold mb-1">
                                ${escapeHTML(order.artist)}
                            </h5>

                            <small class="text-muted">
                                ${escapeHTML(order.order_code)}
                            </small>
                        </div>

                        <span class="demo-label">
                            SIMULASI BERHASIL
                        </span>
                    </div>

                    <hr>

                    <div class="row">
                        <div class="col-md-6 mb-2">
                            <small class="text-muted">Jenis Tiket</small>
                            <div>${escapeHTML(order.ticket_type)}</div>
                        </div>

                        <div class="col-md-6 mb-2">
                            <small class="text-muted">Jumlah Tiket</small>
                            <div>${order.quantity}</div>
                        </div>

                        <div class="col-md-6 mb-2">
                            <small class="text-muted">Total</small>
                            <div class="fw-bold">
                                ${formatRupiah(order.total)}
                            </div>
                        </div>

                        <div class="col-md-6 mb-2">
                            <small class="text-muted">Tanggal Pembelian</small>
                            <div>${date}</div>
                        </div>
                    </div>

                    <button class="btn btn-dark btn-sm mt-3 detail-button">
                        Lihat Detail & QR Tiket
                    </button>

                    <div class="ticket-details" hidden></div>
                `;

                container.appendChild(card);

                const button = card.querySelector(".detail-button");
                const details = card.querySelector(".ticket-details");

                button.addEventListener("click", async () => {
                    if (!details.hidden) {
                        details.hidden = true;
                        button.textContent = "Lihat Detail & QR Tiket";
                        return;
                    }

                    button.disabled = true;
                    button.textContent = "Memuat tiket...";

                    try {
                        const { data: tickets, error: ticketError } =
                            await supabase
                                .from("tickets")
                                .select("ticket_code, qr_token, ticket_status")
                                .eq("order_id", order.id);

                        if (ticketError) throw ticketError;

                        if (!tickets || tickets.length !== Number(order.quantity)) {
                            throw new Error("Data tiket belum lengkap.");
                        }

                        details.replaceChildren();

                        const title = document.createElement("h6");
                        title.className = "fw-bold mt-3";
                        title.textContent = "Detail Tiket";

                        details.appendChild(title);

                        tickets.forEach((ticket, index) => {
                            const item = document.createElement("div");
                            item.className = "ticket-item";

                            const heading = document.createElement("strong");
                            heading.textContent = `Tiket ${index + 1}`;

                            const code = document.createElement("p");
                            code.className = "mb-1 mt-2";
                            code.textContent = `Kode: ${ticket.ticket_code}`;

                            const status = document.createElement("p");
                            status.className = "mb-1";
                            status.textContent = `Status: ${ticket.ticket_status}`;

                            const qr = document.createElement("div");
                            qr.className = "qr-box";

                            const note = document.createElement("p");
                            note.className = "small text-muted mt-2 mb-0";
                            note.textContent =
                                "QR demo — bukan tiket untuk masuk venue.";

                            item.append(heading, code, status, qr, note);
                            details.appendChild(item);

                            new QRCode(qr, {
                                text: "LIVELY-DEMO:" + ticket.qr_token,
                                width: 160,
                                height: 160,
                                correctLevel: QRCode.CorrectLevel.H
                            });
                        });

                        details.hidden = false;
                        button.textContent = "Tutup Detail";

                    } catch (err) {
                        alert(err.message || "Gagal memuat detail tiket.");
                    } finally {
                        button.disabled = false;

                        if (details.hidden) {
                            button.textContent = "Lihat Detail & QR Tiket";
                        }
                    }
                });
            }

        } catch (error) {
            console.error("Riwayat tiket error:", error);
            message.textContent =
                error.message || "Gagal memuat riwayat tiket.";
        }
    }

    function formatRupiah(value) {
        return new Intl.NumberFormat("id-ID", {
            style: "currency",
            currency: "IDR",
            maximumFractionDigits: 0
        }).format(value);
    }

    function escapeHTML(value) {
        return String(value ?? "").replace(/[&<>"']/g, char => ({
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#39;"
        })[char]);
    }

    loadOrders();
</script>

</body>
</html>
