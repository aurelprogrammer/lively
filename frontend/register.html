
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register — LIVELY</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">

<nav class="navbar navbar-dark">
    <div class="container">
        <a class="navbar-brand fw-bold fs-3" href="index.html">LIVELY<span>.</span></a>
        <a href="index.html" class="text-white text-decoration-none">← Back to Home</a>
    </div>
</nav>

<main class="auth-wrapper">
    <div class="auth-card">
        <span class="section-label">JOIN THE EXPERIENCE</span>
        <h1>Create Account.</h1>
        <p class="auth-subtitle">Buat akun dan mulai pengalaman konsermu.</p>

        <form id="registerForm">
            <div class="mb-3">
                <label class="form-label" for="name">Full Name</label>
                <input type="text" class="form-control" id="name"
                    placeholder="Nama lengkap" required minlength="3">
            </div>

            <div class="mb-3">
                <label class="form-label" for="email">Email Address</label>
                <input type="email" class="form-control" id="email"
                    placeholder="nama@email.com" required>
            </div>

            <div class="mb-3">
                <label class="form-label" for="password">Password</label>
                <input type="password" class="form-control" id="password"
                    placeholder="Minimal 8 karakter" minlength="8" required>
            </div>

            <div class="mb-4">
                <label class="form-label" for="confirmPassword">Confirm Password</label>
                <input type="password" class="form-control" id="confirmPassword"
                    placeholder="Ulangi password" minlength="8" required>
            </div>

            <div class="form-check mb-4">
                <input class="form-check-input" type="checkbox" id="terms" required>
                <label class="form-check-label small" for="terms">
                    Saya menyetujui syarat dan ketentuan LIVELY.
                </label>
            </div>

            <button type="submit" class="btn btn-gold w-100 py-3 rounded-pill">
                Create Account
            </button>

            <p id="registerMessage" class="mt-3 small text-center" aria-live="polite"></p>
        </form>

        <p class="auth-bottom">
            Already have an account?
            <a href="login.html">Login</a>
        </p>
    </div>
</main>

<script type="module" src="js/script.js"></script>
</body>
</html>
