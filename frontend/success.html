
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pesanan Berhasil | LIVELY</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background:#101010; color:white; }
        .receipt {
            max-width:600px;
            margin:70px auto;
            padding:35px;
            background:#1d1d1d;
            border:1px solid #51452e;
            border-radius:18px;
        }
        .gold { color:#d6ad60; }
        .btn-gold { background:#d6ad60; color:#111; font-weight:bold; }
    </style>
</head>
<body>
    <div class="container">
        <div class="receipt">
            <h2 class="gold text-center mb-2">LIVELY.</h2>
            <h3 class="text-center">Pesanan Tercatat!</h3>
            <p class="text-center text-secondary">Berikut ringkasan pesanan demo kamu.</p>
            <hr>
            <p>ID Pesanan: <strong id="orderId">-</strong></p>
            <p>Nama: <strong id="name">-</strong></p>
            <p>Email: <strong id="email">-</strong></p>
            <p>Konser: <strong id="artist">-</strong></p>
            <p>Tiket: <strong id="ticket">-</strong></p>
            <p>Jumlah: <strong id="quantity">-</strong></p>
            <p>Metode Pembayaran: <strong id="payment">-</strong></p>
            <h4 class="gold mt-4">Total: <span id="total">Rp0</span></h4>
            <p class="text-warning mt-3" id="status">Menunggu Pembayaran</p>
            <p class="text-secondary small">Ini hanya konfirmasi demo. Belum ada pembayaran atau tiket resmi yang diterbitkan.</p>
            <a href="index.html" class="btn btn-gold w-100 mt-3">Kembali ke Beranda</a>
        </div>
    </div>

    <script>
        const receipt = JSON.parse(sessionStorage.getItem("livelyReceipt") || "null");

        if (!receipt) {
            document.querySelector(".receipt").innerHTML =
                '<h3 class="gold">Data pesanan tidak ditemukan.</h3><a href="concerts.html" class="btn btn-warning mt-3">Pilih Konser</a>';
        } else {
            const fields = {
                orderId: receipt.orderId,
                name: receipt.name,
                email: receipt.email,
                artist: receipt.artist,
                ticket: receipt.ticket,
                quantity: receipt.quantity,
                payment: receipt.payment,
                total: "Rp" + Number(receipt.total).toLocaleString("id-ID"),
                status: receipt.status
            };

            Object.entries(fields).forEach(([id, value]) => {
                document.getElementById(id).textContent = value;
            });
        }
    </script>
</body>
</html>
