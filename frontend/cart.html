
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keranjang | LIVELY</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        body { background:#101010; color:white; }
        .cart-card { background:#1d1d1d; border:1px solid #39332a; border-radius:15px; padding:25px; }
        .gold { color:#d6ad60; }
        .btn-gold { background:#d6ad60; color:#111; font-weight:bold; border:0; }
        .btn-gold:hover { background:#edc77d; }
        .ticket-row { border-bottom:1px solid #393939; padding:18px 0; }
        .form-control, .form-select { background:#292929; color:white; border-color:#555; }
        .form-control:focus, .form-select:focus { background:#292929; color:white; }
    </style>
</head>
<body>

<nav class="navbar navbar-dark bg-black">
    <div class="container">
        <a class="navbar-brand fw-bold gold" href="index.html">LIVELY.</a>
        <a href="concerts.html" class="btn btn-outline-light btn-sm">Pilih Konser</a>
    </div>
</nav>

<div class="container py-5">
    <h1 class="fw-bold mb-2">Keranjang Tiket</h1>
    <p class="text-secondary mb-4">Periksa pilihan tiket sebelum melanjutkan.</p>

    <div class="row g-4">
        <div class="col-lg-8">
            <div class="cart-card">
                <h4 class="gold">Detail Pesanan</h4>
                <p id="cartStatus" class="text-warning small" role="status" aria-live="polite">
                    Memuat data konser...
                </p>
                <div class="ticket-row">
                    <label class="form-label">Nama Konser</label>
                    <input type="text" id="artist" class="form-control" readonly>
                </div>

                <div class="ticket-row">
                    <label class="form-label">Jenis Tiket</label>
                    <select id="ticketType" class="form-select">
                        <option value="Regular">Regular</option>
                        <option value="Festival">Festival</option>
                        <option value="VIP">VIP</option>
                    </select>
                </div>

                <div class="ticket-row">
                    <label class="form-label">Jumlah Tiket</label>
                    <input type="number" id="quantity" class="form-control" value="1" min="1" max="10">
                </div>
            </div>
        </div>

        <div class="col-lg-4">
            <div class="cart-card">
                <h4 class="gold mb-4">Ringkasan</h4>
                <div class="d-flex justify-content-between mb-3">
                    <span>Harga tiket</span>
                    <span id="price">-</span>
                </div>
                <div class="d-flex justify-content-between mb-3">
                    <span>Jumlah</span>
                    <span id="qty">1</span>
                </div>
                <hr class="border-secondary">
                <div class="d-flex justify-content-between fw-bold mb-4">
                    <span>Total</span>
                    <span class="gold" id="total">-</span>
                </div>
                <button id="checkoutButton" class="btn btn-gold w-100" disabled>
                    Lanjut Checkout
                </button>
                <a href="concerts.html" class="btn btn-outline-light w-100 mt-2">
                    Tambah Konser
                </a>
            </div>
        </div>
    </div>
</div>

<script type="module">
    import { supabase } from "./js/supabase.js";

    const params = new URLSearchParams(location.search);
    const concertId = params.get("id");
    const selectedTicket = params.get("ticket");

    const artistInput = document.getElementById("artist");
    const ticketType = document.getElementById("ticketType");
    const quantity = document.getElementById("quantity");
    const checkoutButton = document.getElementById("checkoutButton");
    const cartStatus = document.getElementById("cartStatus");
    let concert = null;

    function rupiah(number) {
        return new Intl.NumberFormat("id-ID", {
            style: "currency",
            currency: "IDR",
            maximumFractionDigits: 0
        }).format(number);
    }

    function updateTotal() {
        const priceColumns = {
            Regular: "regular_price",
            Festival: "festival_price",
            VIP: "vip_price"
        };
        const price = concert
            ? Number(concert[priceColumns[ticketType.value]])
            : NaN;
        const qty = Math.max(1, Math.min(10, Number(quantity.value) || 1));
        quantity.value = qty;

        document.getElementById("price").textContent =
            Number.isFinite(price) && price > 0 ? rupiah(price) : "-";
        document.getElementById("qty").textContent = qty;
        document.getElementById("total").textContent =
            Number.isFinite(price) && price > 0 ? rupiah(price * qty) : "-";
        checkoutButton.disabled = !concert || !Number.isFinite(price) || price <= 0;
    }

    ticketType.addEventListener("change", updateTotal);
    quantity.addEventListener("input", updateTotal);

    async function loadConcert() {
        if (!concertId) {
            throw new Error("ID konser tidak ditemukan. Silakan pilih konser kembali.");
        }

        const { data, error } = await supabase
            .from("concerts")
            .select("id,title,artist,date,location,regular_price,festival_price,vip_price")
            .eq("id", concertId)
            .eq("is_active", true)
            .maybeSingle();

        if (error) throw error;
        if (!data) {
            throw new Error("Konser tidak ditemukan atau sudah tidak aktif.");
        }

        concert = data;
        artistInput.value = `${concert.title} — ${concert.artist}`;
        if (["Regular", "Festival", "VIP"].includes(selectedTicket)) {
            ticketType.value = selectedTicket;
        }
        Array.from(ticketType.options).forEach(option => {
            const priceColumn = {
                Regular: "regular_price",
                Festival: "festival_price",
                VIP: "vip_price"
            }[option.value];
            const price = Number(concert[priceColumn]);
            option.textContent = Number.isFinite(price) && price > 0
                ? `${option.value} - ${rupiah(price)}`
                : `${option.value} - Tidak tersedia`;
        });

        cartStatus.textContent = "";
        updateTotal();
    }

    checkoutButton.addEventListener("click", () => {
        if (!concert || checkoutButton.disabled) return;

        const ticketPrice = Number(ticketType.value === "Regular"
            ? concert.regular_price
            : ticketType.value === "Festival"
                ? concert.festival_price
                : concert.vip_price);
        const order = {
            concert_id: concert.id,
            concert_title: concert.title,
            artist: concert.artist,
            ticket_type: ticketType.value,
            ticket: `${ticketType.value} - ${rupiah(ticketPrice)}`,
            unit_price: ticketPrice,
            quantity: Number(quantity.value),
            total: ticketPrice * Number(quantity.value)
        };

        sessionStorage.setItem("livelyOrder", JSON.stringify(order));
        window.location.href = "checkout.html";
    });

    loadConcert().catch(error => {
        console.error("Cart concert load error:", error);
        cartStatus.textContent =
            error.message || "Data konser gagal dimuat. Silakan coba lagi.";
        cartStatus.classList.add("text-danger");
        checkoutButton.disabled = true;
    });
</script>

</body>
</html>
