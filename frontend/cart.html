
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keranjang | LIVELY</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        body { background:#101010; color:white; }
        .cart-card { background:#1d1d1d; border:1px solid #39332a; border-radius:15px; padding:25px; }
        .gold { color:#d6ad60; }
        .btn-gold { background:#d6ad60; color:#111; font-weight:bold; border:0; }
        .btn-gold:hover { background:#edc77d; }
        .ticket-row { border-bottom:1px solid #393939; padding:18px 0; }
        .form-control, .form-select { background:#292929; color:white; border-color:#555; }
        .form-control:focus, .form-select:focus { background:#292929; color:white; }
    </style>
</head>
<body>

<nav class="navbar navbar-dark bg-black">
    <div class="container">
        <a class="navbar-brand fw-bold gold" href="index.html">LIVELY.</a>
        <a href="concerts.html" class="btn btn-outline-light btn-sm">Pilih Konser</a>
    </div>
</nav>

<div class="container py-5">
    <h1 class="fw-bold mb-2">Keranjang Tiket</h1>
    <p class="text-secondary mb-4">Periksa pilihan tiket sebelum melanjutkan.</p>

    <div class="row g-4">
        <div class="col-lg-8">
            <div class="cart-card">
                <h4 class="gold">Detail Pesanan</h4>
                <div class="ticket-row">
                    <label class="form-label">Nama Konser</label>
                    <input type="text" id="artist" class="form-control" readonly>
                </div>

                <div class="ticket-row">
                    <label class="form-label">Jenis Tiket</label>
                    <select id="ticketType" class="form-select">
                        <option value="150000">Regular - Rp150.000</option>
                        <option value="250000">Festival - Rp250.000</option>
                        <option value="400000">VIP - Rp400.000</option>
                    </select>
                </div>

                <div class="ticket-row">
                    <label class="form-label">Jumlah Tiket</label>
                    <input type="number" id="quantity" class="form-control" value="1" min="1" max="10">
                </div>
            </div>
        </div>

        <div class="col-lg-4">
            <div class="cart-card">
                <h4 class="gold mb-4">Ringkasan</h4>
                <div class="d-flex justify-content-between mb-3">
                    <span>Harga tiket</span>
                    <span id="price">Rp150.000</span>
                </div>
                <div class="d-flex justify-content-between mb-3">
                    <span>Jumlah</span>
                    <span id="qty">1</span>
                </div>
                <hr class="border-secondary">
                <div class="d-flex justify-content-between fw-bold mb-4">
                    <span>Total</span>
                    <span class="gold" id="total">Rp150.000</span>
                </div>
                <button class="btn btn-gold w-100" onclick="checkout()">
                    Lanjut Checkout
                </button>
                <a href="concerts.html" class="btn btn-outline-light w-100 mt-2">
                    Tambah Konser
                </a>
            </div>
        </div>
    </div>
</div>

<script>
    const params = new URLSearchParams(location.search);
    const artist = params.get("artist") || "Slank";

    const artistInput = document.getElementById("artist");
    const ticketType = document.getElementById("ticketType");
    const quantity = document.getElementById("quantity");

    artistInput.value = artist;

    function rupiah(number) {
        return "Rp" + number.toLocaleString("id-ID");
    }

    function updateTotal() {
        const price = Number(ticketType.value);
        const qty = Math.max(1, Math.min(10, Number(quantity.value) || 1));
        quantity.value = qty;

        document.getElementById("price").textContent = rupiah(price);
        document.getElementById("qty").textContent = qty;
        document.getElementById("total").textContent = rupiah(price * qty);
    }

    ticketType.addEventListener("change", updateTotal);
    quantity.addEventListener("input", updateTotal);

    function checkout() {
        const order = {
            artist: artist,
            ticket: ticketType.options[ticketType.selectedIndex].text,
            quantity: Number(quantity.value),
            total: Number(ticketType.value) * Number(quantity.value)
        };

        sessionStorage.setItem("livelyOrder", JSON.stringify(order));
        window.location.href = "checkout.html";
    }

    updateTotal();
</script>

</body>
</html>
